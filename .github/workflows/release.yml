name: Build & Publish Release

on:
  push:
    branches:
      - standalone
    paths:
      - 'version.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    # A metadata-only version.json update can skip the release job by putting [skip ci] in the commit message.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # full history: the app's "What's new" page is generated from every commit of version.json
          fetch-depth: 0

      # termux-am (termux/TermuxAm): am.apk is built from it for ai.dui. Only this submodule: the other folders
      # (termux-api, termux-x11, dui_plugins) are embedded repos without a .gitmodules entry.
      - name: Fetch the termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Parse version.json
        id: version
        run: |
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          VERSION_CODE=$(python3 -c "import json; print(json.load(open('version.json')).get('version_code', 1))")
          CHANGELOG=$(python3 -c "import json; cl = json.load(open('version.json')).get('changelog', ''); print('\n'.join(cl) if isinstance(cl, list) else cl)")
          echo "tag=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "name=v${VERSION_NAME}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Verify Keystore
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          sha256sum app/release.jks
          [ -n "$RELEASE_STORE_PASSWORD" ] && echo "store password: set" || echo "store password: EMPTY"
          [ -n "$RELEASE_KEY_PASSWORD" ] && echo "key password: set" || echo "key password: EMPTY"
          [ -n "$RELEASE_KEY_ALIAS" ] && echo "key alias: set" || echo "key alias: EMPTY"
          keytool -list -keystore app/release.jks -storepass "$RELEASE_STORE_PASSWORD" > /dev/null 2>&1 \
            && echo "store password opens the keystore: yes" || echo "store password opens the keystore: no"
          cat > /tmp/CheckKey.java <<'EOF'
          import java.io.FileInputStream;
          import java.security.KeyStore;
          public class CheckKey {
            static KeyStore open(String storePass) throws Exception {
              KeyStore ks = KeyStore.getInstance("PKCS12");
              try (FileInputStream in = new FileInputStream("app/release.jks")) { ks.load(in, storePass.toCharArray()); }
              return ks;
            }
            static boolean keyOk(KeyStore ks, String alias, String keyPass) {
              try { return ks.getKey(alias, keyPass.toCharArray()) != null; } catch (Exception e) { return false; }
            }
            public static void main(String[] a) throws Exception {
              KeyStore ks = open(a[0]);
              System.out.println("alias exists: " + ks.containsAlias(a[1]));
              System.out.println("raw key password: " + (keyOk(ks, a[1], a[2]) ? "ok" : "wrong"));
              System.out.println("store password as key password: " + (keyOk(ks, a[1], a[0]) ? "ok" : "wrong"));
              String trimmed = a[2].replaceAll("[\\r\\n]+$", "");
              if (!trimmed.equals(a[2])) {
                System.out.println("trimmed key password: " + (keyOk(ks, a[1], trimmed) ? "ok" : "wrong"));
              }
            }
          }
          EOF
          java /tmp/CheckKey.java "$RELEASE_STORE_PASSWORD" "$RELEASE_KEY_ALIAS" "$RELEASE_KEY_PASSWORD" 2>/dev/null \
            || echo "keystore check crashed"

      - name: Build Release APKs
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Publish integrity metadata (version.json with the APK's SHA-256)
        run: |
          set -euo pipefail
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json')).get('version_name', '1.0.0'))")
          APK="output/DuiAI-v${VERSION_NAME}.apk"
          test -f "$APK" || { echo "Missing $APK"; exit 1; }
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          python3 - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          data = json.load(open('version.json'))
          data['sha256'] = sha
          name = data['version_name']
          data['download_url'] = (
              'https://github.com/tadak5422-spec/Dui-Ai-King/releases/download/'
              f'v{name}/DuiAI-v{name}.apk'
          )
          with open('output/version.json', 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          PY
          cat output/version.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body: ${{ steps.version.outputs.changelog }}
          generate_release_notes: true
          files: output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
